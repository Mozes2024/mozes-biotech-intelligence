name: feed-probe
on:
  workflow_dispatch:
    inputs:
      extra:
        description: 'Space-separated candidate feed URLs to probe'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - name: Probe hot-lane feeds (status, XML, item counts)
        env:
          EXTRA: ${{ inputs.extra }}
        run: python scripts/capture_feed_fixtures.py --save --extra "$EXTRA"
      - uses: actions/upload-artifact@v4
        with:
          name: feed-samples
          path: tests/fixtures/feeds/
          retention-days: 7
