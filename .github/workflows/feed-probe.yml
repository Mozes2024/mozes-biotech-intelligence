name: feed-probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - name: Probe hot-lane feeds (status, XML, item counts)
        run: python scripts/capture_feed_fixtures.py --save --list-fda
      - uses: actions/upload-artifact@v4
        with:
          name: feed-samples
          path: tests/fixtures/feeds/
          retention-days: 7
