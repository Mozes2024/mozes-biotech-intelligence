name: feed-probe
on:
  workflow_dispatch:
    inputs:
      extra:
        description: 'Space-separated candidate feed URLs to probe'
        required: false
        default: ''
      tyra:
        description: 'Read-only TYRA HTTP, XML, dates and official-host diagnostic'
        type: boolean
        default: false
      edge_backlog:
        description: 'Fixed read-only SELECT of backlog age, retries and completion evidence'
        type: boolean
        default: false
      ir_coverage:
        description: 'Read-only issuer source check in a disposable database'
        type: boolean
        default: false
      rapp_incident:
        description: 'Read-only SEC and retained Edge evidence for accession 0001193125-26-425647'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - name: Probe hot-lane feeds (status, XML, item counts)
        env:
          EXTRA: ${{ inputs.extra }}
        run: python scripts/capture_feed_fixtures.py --save --extra "$EXTRA"
      - uses: actions/upload-artifact@v4
        with:
          name: feed-samples
          path: tests/fixtures/feeds/
          retention-days: 7
      - name: Inspect official TYRA RSS and HTML without monitor state
        if: inputs.tyra
        run: python scripts/probe_tyra_ir.py
      - name: Inspect reviewed issuer fallback sources without production state
        if: inputs.ir_coverage
        run: python scripts/probe_ir_coverage.py --tickers TYRA CYTK TVTX ALNY ARGX AMGN CRSP SLS GILD ARWR --output .diagnostics/ir-coverage.json
      - uses: actions/upload-artifact@v4
        if: inputs.ir_coverage
        with:
          name: ir-coverage-readonly
          path: .diagnostics/ir-coverage.json
          retention-days: 7
      - name: Read Edge backlog without mutations
        if: inputs.edge_backlog
        env:
          CLOUDFLARE_RECOVERY_READ_TOKEN: ${{ secrets.CLOUDFLARE_RECOVERY_READ_TOKEN }}
        run: python scripts/audit_edge_backlog.py
      - name: Inspect reported RAPP incident without processing or notifications
        if: inputs.rapp_incident
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          CLOUDFLARE_RECOVERY_READ_TOKEN: ${{ secrets.CLOUDFLARE_RECOVERY_READ_TOKEN }}
        run: python scripts/inspect_rapp_incident.py
      - uses: actions/upload-artifact@v4
        if: inputs.rapp_incident
        with:
          name: rapp-readonly-evidence
          path: .diagnostics/rapp/
          retention-days: 7
