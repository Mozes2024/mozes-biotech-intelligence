name: deep-live-monitor
on:
  schedule:
    - cron: '20 6 * * 1,3,5'
  workflow_dispatch:
    inputs:
      deep_refresh:
        description: 'Run bounded full discovery in addition to the lightweight pass'
        required: false
        default: true
        type: boolean
permissions:
  contents: read
  actions: write
concurrency:
  group: mozes-deep-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
      MOZES_DB_PATH: .monitor/mozes-live.db
      MOZES_NEWS_ENABLED: '1'
      MOZES_HTTP_CACHE: .monitor/http-cache
      MOZES_PRIMARY_FEEDS: '1'
      MOZES_ALERT_DISPATCH: '1'
      MOZES_NTFY_URL: ${{ secrets.MOZES_NTFY_URL }}
      MOZES_WEBHOOK_URL: ${{ secrets.MOZES_WEBHOOK_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - name: Restore the single monitor-state lineage
        run: python scripts/restore_monitor_state.py
      - name: Deep research observe (never blocks hot concurrency)
        id: data
        run: python -m mozes.pipeline_v2c monitor --deep
      - uses: actions/upload-artifact@v4
        with:
          name: mozes-live-monitor
          path: |
            .monitor/mozes-live.db
            .monitor/manifest.json
            .monitor/http-cache
          include-hidden-files: true
          retention-days: 90
      - name: Publish only changed data or the daily heartbeat
        if: steps.data.outputs.should_publish == 'true'
        run: |
          gh workflow run pages.yml --ref main -f source_run_id="$GITHUB_RUN_ID"
