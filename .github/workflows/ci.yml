name: ci
on:
  push:
    branches: [main]
    paths: ['mozes/**', 'tests/**', 'web/**', 'scripts/**', 'pyproject.toml', '.github/workflows/**', 'Dockerfile', 'deploy/**', 'cloudflare/**']
  pull_request:
    paths: ['mozes/**', 'tests/**', 'web/**', 'scripts/**', 'pyproject.toml', '.github/workflows/**', 'Dockerfile', 'deploy/**', 'cloudflare/**']
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Verify the exact approved production baseline.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: npm ci --prefix cloudflare
      - name: Complete offline regression suite
        run: pytest -q
      - name: Syntax checks
        run: |
          python -m compileall -q mozes scripts
          for file in web/*.js; do node --check "$file"; done
      - name: Cloudflare hot edge Worker
        run: |
          npm test --prefix cloudflare
      - name: Offline product smoke test
        env:
          MOZES_DB_PATH: /tmp/mozes-ci.db
        run: |
          mozes bootstrap-v2
          mozes export-v3
          test -s web/data.json
          test -s web/financial_context_ui.js
  worker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Build the hot-lane worker image
        run: docker build -t mozes-hot:ci .
      - name: Worker imports and data files are packaged
        run: |
          docker run --rm mozes-hot:ci python -c "import mozes.hot_monitor, mozes.ir_registry as r; assert r.load_aliases()['GMAB']; print('ok')"
