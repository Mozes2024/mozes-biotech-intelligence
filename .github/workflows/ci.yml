name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: v0.3 smoke
        run: |
          export MOZES_DB_PATH=/tmp/mozes-ci.db
          mozes bootstrap-v2
          mozes radar-v2 --as-of 2026-09-30
          mozes export-v3 --as-of 2026-09-30
          test -s web/data.json
          test -s web/index.html
          test -s web/app.js
          test -s web/styles.css
