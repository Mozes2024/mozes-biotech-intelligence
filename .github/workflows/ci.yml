name: ci
on:
  push:
    branches: [main]
    paths: ['mozes/**', 'tests/**', 'web/**', 'scripts/**', 'pyproject.toml', '.github/workflows/**']
  pull_request:
    paths: ['mozes/**', 'tests/**', 'web/**', 'scripts/**', 'pyproject.toml', '.github/workflows/**']
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Complete offline regression suite
        run: pytest -q
      - name: Syntax checks
        run: |
          python -m compileall -q mozes scripts
          for file in web/*.js; do node --check "$file"; done
      - name: Offline product smoke test
        env:
          MOZES_DB_PATH: /tmp/mozes-ci.db
        run: |
          mozes bootstrap-v2
          mozes export-v3
          test -s web/data.json
          test -s web/financial_context_ui.js
