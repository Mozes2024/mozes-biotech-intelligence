name: ci
on:
  push:
    branches: [main]
    paths: ['mozes/**', 'tests/**', 'web/**', 'scripts/**', 'pyproject.toml', '.github/workflows/**', 'Dockerfile', 'deploy/**', 'cloudflare/**']
  pull_request:
    paths: ['mozes/**', 'tests/**', 'web/**', 'scripts/**', 'pyproject.toml', '.github/workflows/**', 'Dockerfile', 'deploy/**', 'cloudflare/**']
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Reproduce the pinned pre-optimization D1 benchmark.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: npm ci --prefix cloudflare
      - name: Complete offline regression suite
        run: pytest -q
      - name: Syntax checks
        run: |
          python -m compileall -q mozes scripts
          for file in web/*.js; do node --check "$file"; done
      - name: Cloudflare hot edge Worker
        run: |
          node cloudflare/test.mjs
          node cloudflare/test_alert_feed.mjs
          node cloudflare/test_hot_edge.mjs
      - name: Local D1 query plans and 24-hour workload
        run: |
          node cloudflare/profile_d1.mjs
          node cloudflare/benchmark_d1.mjs
          node cloudflare/benchmark_fairness.mjs
      - name: Offline product smoke test
        env:
          MOZES_DB_PATH: /tmp/mozes-ci.db
        run: |
          mozes bootstrap-v2
          mozes export-v3
          test -s web/data.json
          test -s web/financial_context_ui.js
  worker-image:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Build the hot-lane worker image
        run: docker build -t mozes-hot:ci .
      - name: Worker imports and data files are packaged
        run: |
          docker run --rm mozes-hot:ci python -c "import sys, ssl, sqlite3; assert sys.version_info[:3] == (3, 11, 17); import mozes.hot_monitor, mozes.ir_registry as r; assert r.load_aliases()['GMAB']; print('ok')"

  readonly-readiness:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Trusted preparation ancestry and exact file allowlist
        run: |
          test "$(git rev-parse HEAD^)" = ca882350581f9be11010adc48465e3a369b84ea1
          git diff --exit-code HEAD^ HEAD -- mozes scripts/incident_recovery.py scripts/restore_monitor_state.py
          test "$(git diff --name-only HEAD^ HEAD | sort)" = "$(printf '%s\n' .github/workflows/ci.yml scripts/verify_readiness_readonly.py | sort)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - name: Consolidated sanitized read-only verification
        env:
          CLOUDFLARE_RECOVERY_READ_TOKEN: ${{ secrets.CLOUDFLARE_RECOVERY_READ_TOKEN }}
          EDGE_SYNC_TOKEN: ${{ secrets.EDGE_SYNC_TOKEN }}
          MOZES_EDGE_SYNC_URL: ${{ vars.MOZES_EDGE_SYNC_URL }}
          MOZES_INCIDENT_APPROVED_MAIN: ${{ vars.MOZES_INCIDENT_APPROVED_MAIN }}
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.verify_readiness_readonly
