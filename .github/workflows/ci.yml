name: ci
on:
  push:
    branches: [main]
    paths: ['mozes/**', 'tests/**', 'web/**', 'scripts/**', 'pyproject.toml', '.github/workflows/**', 'Dockerfile', 'deploy/**', 'cloudflare/**']
  pull_request:
    paths: ['mozes/**', 'tests/**', 'web/**', 'scripts/**', 'pyproject.toml', '.github/workflows/**', 'Dockerfile', 'deploy/**', 'cloudflare/**']
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Reproduce the pinned pre-optimization D1 benchmark.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: npm ci --prefix cloudflare
      - name: Complete offline regression suite
        run: pytest -q
      - name: Complete frontend regressions including checkpoint and alert preservation
        run: node --test tests/*.mjs
      - name: Syntax checks
        run: |
          python -m compileall -q mozes scripts
          for file in web/*.js; do node --check "$file"; done
      - name: Cloudflare hot edge Worker
        run: |
          node cloudflare/test.mjs
          node cloudflare/test_alert_feed.mjs
          node --test cloudflare/test_a5_feed_contract.mjs cloudflare/test_a5_semantics.mjs cloudflare/test_alert_cache.mjs
          node cloudflare/test_hot_edge.mjs
      - name: Local D1 query plans and 24-hour workload
        run: |
          node cloudflare/profile_d1.mjs
          node cloudflare/benchmark_d1.mjs
          node cloudflare/benchmark_fairness.mjs
      - name: Offline product smoke test
        env:
          MOZES_DB_PATH: /tmp/mozes-ci.db
        run: |
          mozes bootstrap-v2
          mozes export-v3
          test -s web/data.json
          test -s web/financial_context_ui.js
  worker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Build the hot-lane worker image
        run: docker build -t mozes-hot:ci .
      - name: Prospective capture is packaged and inactive
        run: docker run --rm mozes-hot:ci python -c "import os, mozes.prospective_capture, mozes.prospective_pilot, mozes.prospective_authorization, mozes.prospective_cleanup; assert os.environ.get('MOZES_PROSPECTIVE_CAPTURE') != '1'; print('prospective capture, pilot, one-shot guard and cleanup packaged; disabled by default')"
      - name: Worker imports and data files are packaged
        run: |
          docker run --rm mozes-hot:ci python -c "import sys, ssl, sqlite3; assert sys.version_info[:3] == (3, 11, 17); import mozes.hot_monitor, mozes.ir_registry as r; assert r.load_aliases()['GMAB']; print('ok')"
          docker run --rm mozes-hot:ci python -c "import os, mozes.price_staging, mozes.ingest.price_provenance; assert all(os.environ.get('MOZES_PRICE_' + kind + '_ENABLED') != '1' for kind in ('STAGING', 'SELECTION')); print('price staging imports ok; controls disabled; no database opened')"
