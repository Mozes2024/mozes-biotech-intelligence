name: production-candidate-checks
on:
  push:
    branches: [codex/production-baseline-fairness, codex/production-baseline-rollback]
permissions:
  contents: read
jobs:
  worker-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test --prefix cloudflare
