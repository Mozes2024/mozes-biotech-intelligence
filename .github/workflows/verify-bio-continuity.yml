name: verify-bio-continuity
on:
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: mozes-hot-monitor
  cancel-in-progress: false
  queue: max
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - name: Read-only approved-source preservation and Cloudflare capability gates
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EDGE_SYNC_TOKEN: ${{ secrets.EDGE_SYNC_TOKEN }}
          MOZES_EDGE_SYNC_URL: ${{ vars.MOZES_EDGE_SYNC_URL }}
          MOZES_INCIDENT_APPROVED_MAIN: ${{ vars.MOZES_INCIDENT_APPROVED_MAIN }}
          SOURCE_RUN_ID: '39474053120'
          MONITOR_RECOVERY_SHA256: '94bda318e9f8e553709b295d5249cebf269002cefc4d718c0cd51f1dc21192c1'
        run: python -m scripts.bio_continuity_control verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bio-continuity-readonly-proof
          path: .diagnostics/bio-continuity/proof-verify.json
          retention-days: 14
