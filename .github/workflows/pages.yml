name: deploy-pages
on:
  workflow_run:
    workflows: ['ci']
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Optional completed data-producer artifact (numeric run ID)'
        required: false
        type: string
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      publish: ${{ steps.guard.outputs.current }}
    env:
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
      MOZES_DB_PATH: /tmp/mozes-pages.db
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Do not publish superseded code
        id: guard
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$(git rev-parse HEAD)" = "$current" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'Newer code exists; its own CI will own publication.'
          fi
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.current == 'true'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - if: steps.guard.outputs.current == 'true'
        run: pip install -e .
      - name: Restore known data without a new source scan
        if: steps.guard.outputs.current == 'true'
        run: python scripts/restore_monitor_state.py
      - name: Export current code against stored data (offline)
        if: steps.guard.outputs.current == 'true'
        run: python -m mozes.pipeline_v2c export
      - uses: actions/upload-artifact@v4
        if: steps.guard.outputs.current == 'true'
        with:
          name: mozes-publish-request
          path: web/publish-receipt.json
          retention-days: 7
      - uses: actions/configure-pages@v5
        if: steps.guard.outputs.current == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.guard.outputs.current == 'true'
        with:
          path: web
  deploy:
    if: needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/download-artifact@v4
        with:
          name: mozes-publish-request
          path: /tmp/mozes-published
      - name: Acknowledge ledger only after successful deployment
        uses: actions/upload-artifact@v4
        with:
          name: mozes-published-ledger
          path: /tmp/mozes-published/publish-receipt.json
          retention-days: 90
