name: deploy-pages
on:
  push:
    branches: [main]
  schedule:
    - cron: "45 5 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
      MOZES_DB_PATH: /tmp/mozes-pages.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: mozes bootstrap-v2
      - name: Refresh public snapshot
        shell: bash
        run: |
          if [ -n "$SEC_USER_AGENT" ]; then
            mozes refresh-v2 --months 9 || echo "Live refresh failed; deploying the verified local snapshot."
          else
            mozes discover-v2 --months 9 || echo "CT.gov discovery failed; deploying the verified local snapshot."
          fi
      - name: Audit current security listings
        run: mozes audit-securities --provider auto
      - name: Import starter historical cases and fixed price capture
        run: |
          mozes historical-import --file mozes/data/historical_starter.json
          for ticker_case in 'KOD PIT-KOD-DAYBREAK-20260928' 'QTTB PIT-QTTB-SIGNALAA-20260713' 'PHAR PIT-PHAR-JOENJA-20260911'; do
            set -- $ticker_case
            mozes historical-prices --case "$2" --provider csv --stock-file "mozes/data/starter_prices/$1.csv" --benchmark-file mozes/data/starter_prices/XBI.csv --source-url https://query1.finance.yahoo.com/v8/finance/chart/
          done
      - run: mozes export-v3
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
