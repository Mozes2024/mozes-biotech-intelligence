name: verify-monitor-recovery
on:
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  # Hold the production lineage lock while taking the read-only evidence snapshot.
  group: mozes-hot-monitor
  cancel-in-progress: false
  queue: max
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      MOZES_EDGE_SYNC_URL: ${{ vars.MOZES_EDGE_SYNC_URL }}
      MOZES_INCIDENT_APPROVED_MAIN: ${{ vars.MOZES_INCIDENT_APPROVED_MAIN }}
      # October 20 incident: verification only; no recovery authorization.
      SOURCE_RUN_ID: '39310031856'
      MONITOR_RECOVERY_SHA256: '4dc73cc369e79c63c9009c35a494038de8f82ea79fcf716aab5a076c9e162e1d'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require trusted verification ref
        # Permit isolated rehearsal before merge; this workflow cannot process alerts.
        run: python -c "import os; assert os.environ['GITHUB_REF'] in ('refs/heads/main', 'refs/heads/codex/bio-recovery-20261020'), 'trusted verification ref required'"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the checked-out verifier
        run: pip install -e .
      - name: Verify recovery without writes
        env:
          GH_TOKEN: ${{ github.token }}
          EDGE_SYNC_TOKEN: ${{ secrets.EDGE_SYNC_TOKEN }}
        run: python scripts/restore_monitor_state.py --run-id 39310031856 --verify-recovery-only
