name: verify-monitor-recovery
on:
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: mozes-hot-monitor
  cancel-in-progress: false
  queue: max
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EDGE_SYNC_TOKEN: ${{ secrets.EDGE_SYNC_TOKEN }}
      MOZES_EDGE_SYNC_URL: ${{ vars.MOZES_EDGE_SYNC_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require isolated audit branch
        run: python -c "import os; assert os.environ['GITHUB_REF'] == 'refs/heads/codex/post-recovery-read-audit'"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - name: Read event status only
        run: python scripts/post_recovery_read_audit.py
