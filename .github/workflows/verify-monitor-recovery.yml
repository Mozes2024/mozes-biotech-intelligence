name: verify-monitor-recovery
on:
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  # Hold the production lineage lock while taking the read-only evidence snapshot.
  group: mozes-hot-monitor
  cancel-in-progress: false
  queue: max
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      MOZES_EDGE_SYNC_URL: ${{ vars.MOZES_EDGE_SYNC_URL }}
      MOZES_INCIDENT_APPROVED_MAIN: ${{ vars.MOZES_INCIDENT_APPROVED_MAIN }}
      # October 20 18:24 producer (current newest durable lineage): verification only.
      SOURCE_RUN_ID: '39474053120'
      MONITOR_RECOVERY_SHA256: '94bda318e9f8e553709b295d5249cebf269002cefc4d718c0cd51f1dc21192c1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require trusted verification ref
        # Permit isolated rehearsal before merge; this workflow cannot process alerts.
        run: python -c "import os; assert os.environ['GITHUB_REF'] in ('refs/heads/main', 'refs/heads/fix/ordinary-resume-and-watchdog-20261021'), 'trusted verification ref required'"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the checked-out verifier
        run: pip install -e .
      - name: Verify recovery without writes
        env:
          GH_TOKEN: ${{ github.token }}
          EDGE_SYNC_TOKEN: ${{ secrets.EDGE_SYNC_TOKEN }}
        run: python scripts/restore_monitor_state.py --run-id 39474053120 --verify-recovery-only
