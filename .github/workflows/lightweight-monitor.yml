name: lightweight-live-monitor
on:
  # Reconciliation fallback; the Cloudflare Durable Object owns Stage-0 detection.
  schedule:
    - cron: '7,22,37,52 * * * *'
    - cron: '20 0,12,18 * * *'
    - cron: '20 6 * * 0,2,4,6'
  workflow_dispatch:
    inputs:
      incident_recovery_authorization:
        description: 'Emergency recovery ONLY after separate human approval: 20261011:38052910145'
        required: false
        type: string
      priority_only:
        description: 'Check the priority issuers and their source feeds only'
        required: false
        default: true
        type: boolean
      source_run_id:
        description: 'Optional successful monitor run ID to restore (recovery only)'
        required: false
        type: string
      recovery_checkpoint_sha256:
        description: 'Reviewed stale checkpoint SHA256 (explicit recovery approval only)'
        required: false
        type: string
      hot_ticker:
        description: 'Edge detected issuer ticker'
        required: false
        type: string
      hot_cik:
        description: 'Edge detected issuer CIK'
        required: false
        type: string
      hot_accession:
        description: 'Edge detected SEC accession'
        required: false
        type: string
      hot_source_url:
        description: 'Edge primary source URL'
        required: false
        type: string
      edge_event_id:
        description: 'Persisted Edge correlation ID to process and acknowledge'
        required: false
        type: string
permissions:
  contents: read
  actions: write
concurrency:
  # Hot lane must never share a lock with deep research refresh.
  group: mozes-hot-monitor
  cancel-in-progress: false
  queue: max
jobs:
  incident_eligibility:
    name: incident-eligibility
    # Disabled until separately reviewed activation; no new cron or dispatcher.
    if: >-
      vars.MOZES_INCIDENT_RECOVERY_ENABLED == '20261011' &&
      (github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.incident_recovery_authorization != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write # Atomic, permanent incident claim; activation requires approval.
      actions: read
    outputs:
      mode: ${{ steps.eligibility.outputs.mode }}
    env:
      MOZES_EDGE_SYNC_URL: ${{ vars.MOZES_EDGE_SYNC_URL }}
      MOZES_INCIDENT_APPROVED_MAIN: ${{ vars.MOZES_INCIDENT_APPROVED_MAIN }}
      MOZES_INCIDENT_MANUAL_APPROVAL: ${{ vars.MOZES_INCIDENT_MANUAL_APPROVAL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - name: Verify incident recovery eligibility
        id: eligibility
        env:
          GH_TOKEN: ${{ github.token }}
          EDGE_SYNC_TOKEN: ${{ secrets.EDGE_SYNC_TOKEN }}
          CLOUDFLARE_RECOVERY_READ_TOKEN: ${{ secrets.CLOUDFLARE_RECOVERY_READ_TOKEN }}
        run: python scripts/incident_recovery.py eligible
      - name: Acquire irreversible incident recovery claim
        if: steps.eligibility.outputs.mode == 'recover'
        env:
          GH_TOKEN: ${{ github.token }}
          EDGE_SYNC_TOKEN: ${{ secrets.EDGE_SYNC_TOKEN }}
          CLOUDFLARE_RECOVERY_READ_TOKEN: ${{ secrets.CLOUDFLARE_RECOVERY_READ_TOKEN }}
        run: python scripts/incident_recovery.py claim
  prospective_claim:
    name: prospective-pilot-claim
    continue-on-error: true # Setup/API/timeout failures must not invalidate monitor checkpoints.
    needs: incident_eligibility
    if: >-
      always() && github.event_name == 'schedule' &&
      vars.MOZES_PROSPECTIVE_CAPTURE == '1' && vars.MOZES_PROSPECTIVE_AUTHORIZATION != '' &&
      vars.MOZES_PROSPECTIVE_PREPARE == '' && inputs.source_run_id == '' &&
      inputs.incident_recovery_authorization == '' &&
      (needs.incident_eligibility.result == 'skipped' ||
      (needs.incident_eligibility.result == 'success' && needs.incident_eligibility.outputs.mode == 'ordinary'))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write # Permanent pilot latch only; no DB, publisher or incident claim.
      actions: read
    outputs:
      claim_sha: ${{ steps.claim.outcome == 'success' && steps.claim.outputs.claim_sha || '' }}
    env:
      MOZES_PROSPECTIVE_CAPTURE: ${{ vars.MOZES_PROSPECTIVE_CAPTURE || '0' }}
      MOZES_PROSPECTIVE_EVENT_IDS: ${{ vars.MOZES_PROSPECTIVE_EVENT_IDS || '[]' }}
      MOZES_PROSPECTIVE_AUTHORIZATION: ${{ vars.MOZES_PROSPECTIVE_AUTHORIZATION }}
      MOZES_PROSPECTIVE_PREPARE: ${{ vars.MOZES_PROSPECTIVE_PREPARE }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      INCIDENT_MODE: ${{ needs.incident_eligibility.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - name: Acquire one-shot prospective claim ${{ vars.MOZES_PROSPECTIVE_AUTHORIZATION }}
        id: claim
        continue-on-error: true # A denied/failed pilot must not stop ordinary monitoring.
        env:
          GH_TOKEN: ${{ github.token }}
          # Boolean only: the variable-write credential never reaches this job.
          MOZES_PROSPECTIVE_CLEANUP_READY: ${{ secrets.MOZES_PROSPECTIVE_CLEANUP_TOKEN != '' }}
        run: python -m mozes.prospective_authorization claim
  monitor:
    needs: [incident_eligibility, prospective_claim]
    if: >-
      always() && ((needs.incident_eligibility.result == 'skipped' &&
      inputs.incident_recovery_authorization == '') ||
      (needs.incident_eligibility.result == 'success' &&
      (needs.incident_eligibility.outputs.mode == 'recover' ||
      needs.incident_eligibility.outputs.mode == 'ordinary')))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: write # Existing publication dispatch; no Git write permission.
    env:
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
      # Separately authorized opt-in; same lock, DB, checkpoint and publisher.
      MOZES_B1_FINANCING_OBSERVATION: ${{ vars.MOZES_B1_FINANCING_OBSERVATION }}
      # Separate pilot approval required; no schema initialization on ordinary capture.
      MOZES_PROSPECTIVE_CAPTURE: ${{ vars.MOZES_PROSPECTIVE_CAPTURE || '0' }}
      MOZES_PROSPECTIVE_EVENT_IDS: ${{ vars.MOZES_PROSPECTIVE_EVENT_IDS || '[]' }}
      MOZES_PROSPECTIVE_PREPARE: ${{ vars.MOZES_PROSPECTIVE_PREPARE }}
      MOZES_PROSPECTIVE_AUTHORIZATION: ${{ vars.MOZES_PROSPECTIVE_AUTHORIZATION }}
      MOZES_DB_PATH: .monitor/mozes-live.db
      MOZES_NEWS_ENABLED: '1'
      MOZES_HTTP_CACHE: .monitor/http-cache
      MOZES_SEC_HOT: '1'
      # FDA / wires / halts are polled by the hot step below, not again by the monitor step.
      MOZES_PRIMARY_FEEDS: '0'
      MOZES_ALERT_DISPATCH: '1'
      # No always-on server: this workflow (one serialized lineage) is the single push owner.
      MOZES_PUSH_FROM_ACTIONS: '1'
      MOZES_NTFY_URL: ${{ secrets.MOZES_NTFY_URL }}
      MOZES_WEBHOOK_URL: ${{ secrets.MOZES_WEBHOOK_URL }}
      MOZES_SMTP_USER: ${{ secrets.MOZES_SMTP_USER }}
      MOZES_SMTP_PASSWORD: ${{ secrets.MOZES_SMTP_PASSWORD }}
      MOZES_ALERT_EMAIL_TO: ${{ secrets.MOZES_ALERT_EMAIL_TO }}
      MOZES_ALERT_FEED_URL: ${{ vars.MOZES_ALERT_FEED_URL }}
      # AI wording is opt-in; source-backed rule explanations work without it.
      MOZES_ALERT_AI: ${{ vars.MOZES_ALERT_AI }}
      MOZES_AI_MODEL: ${{ vars.MOZES_AI_MODEL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MONITOR_RECOVERY_SHA256: ${{ inputs.recovery_checkpoint_sha256 }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      MOZES_HOT_TICKER: ${{ inputs.hot_ticker }}
      MOZES_HOT_CIK: ${{ inputs.hot_cik }}
      MOZES_HOT_ACCESSION: ${{ inputs.hot_accession }}
      MOZES_HOT_SOURCE_URL: ${{ inputs.hot_source_url }}
      MOZES_EDGE_EVENT_ID: ${{ inputs.edge_event_id }}
      MOZES_EDGE_SYNC_URL: ${{ vars.MOZES_EDGE_SYNC_URL }}
      MOZES_INCIDENT_APPROVED_MAIN: ${{ vars.MOZES_INCIDENT_APPROVED_MAIN }}
      MOZES_INCIDENT_MANUAL_APPROVAL: ${{ vars.MOZES_INCIDENT_MANUAL_APPROVAL }}
      INCIDENT_MODE: ${{ needs.incident_eligibility.outputs.mode }}
      RUN_PRIORITY: ${{ inputs.priority_only == true || github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - name: Verify one-shot prospective permit
        id: pilot_permit
        if: needs.prospective_claim.outputs.claim_sha != ''
        continue-on-error: true
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          MOZES_PROSPECTIVE_CLAIM_SHA: ${{ needs.prospective_claim.outputs.claim_sha }}
        run: python -m mozes.prospective_authorization permit
      - name: Restore the single monitor-state lineage
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
          EDGE_SYNC_TOKEN: ${{ secrets.EDGE_SYNC_TOKEN }}
          CLOUDFLARE_RECOVERY_READ_TOKEN: ${{ needs.incident_eligibility.outputs.mode == 'recover' && secrets.CLOUDFLARE_RECOVERY_READ_TOKEN || '' }}
        run: |
          if [ "$INCIDENT_MODE" = 'recover' ] || [ "$SOURCE_RUN_ID" = '38052910145' ]; then
            python scripts/incident_recovery.py process
          else
            python scripts/restore_monitor_state.py
          fi
      - name: Prepare optional private evidence schema from verified retained backup
        if: vars.MOZES_PROSPECTIVE_PREPARE != '' && vars.MOZES_PROSPECTIVE_CAPTURE != '1'
        continue-on-error: true
        timeout-minutes: 1
        env:
          # Initializer process only; the job observer remains disabled.
          MOZES_PROSPECTIVE_CAPTURE: '1'
        run: python -m mozes.prospective_pilot prepare
      - name: Synchronize verified issuer universe to hot edge
        env:
          EDGE_SYNC_TOKEN: ${{ secrets.EDGE_SYNC_TOKEN }}
        run: python -m mozes.edge_sync
      - name: Enrich the correlated Edge event
        id: edge_process
        continue-on-error: true
        env:
          EDGE_SYNC_TOKEN: ${{ secrets.EDGE_SYNC_TOKEN }}
        # Process the exact Edge source before general reconciliation.
        run: python -m mozes.edge_enrichment process
      - name: Reconcile bounded clinical issuer discovery candidates
        id: clinical_process
        env:
          EDGE_SYNC_TOKEN: ${{ secrets.EDGE_SYNC_TOKEN }}
        run: python -m mozes.clinical_reconcile process
      - name: Hot feeds (FDA, wires, Nasdaq halts, company IR) + push
        run: python -m mozes.hot_monitor --once --no-sec --allow-partial
      - name: Hot priority observe + alert outbox
        id: data
        env:
          MOZES_PROSPECTIVE_CLAIM_SHA: ${{ steps.pilot_permit.outcome == 'success' && needs.prospective_claim.outputs.claim_sha || '' }}
        run: |
          if [ "$RUN_PRIORITY" = 'true' ]; then
            python -m mozes.pipeline_v2c monitor --priority-only
          else
            python -m mozes.pipeline_v2c monitor
          fi
      - name: Explain already-queued alerts from their sources
        id: explanation
        # All current source checks and first pushes precede this bounded enrichment.
        continue-on-error: true
        timeout-minutes: 1
        run: python -m mozes.alert_explanation --limit 3
      - name: Export completed explanations without another source scan
        if: steps.explanation.outputs.changed == 'true'
        run: python -m mozes.pipeline_v2c export
      - name: Bind durable checkpoint to monitor database
        id: checkpoint
        if: ${{ always() && steps.restore.outcome == 'success' }}
        run: python -m mozes.edge_enrichment checkpoint
      - uses: actions/upload-artifact@v4
        id: checkpoint_upload
        if: ${{ always() && steps.checkpoint.outcome == 'success' }}
        with:
          name: mozes-live-monitor
          # Keep the artifact small/reliable: the 240MB+ http-cache caused restore to
          # fall back to an old DB and drop live alerts (LPCN). Cache warms itself.
          path: |
            .monitor/mozes-live.db
            .monitor/manifest.json
            .monitor/edge-checkpoint.json
            .monitor/recovery-proof.json
            .monitor/prospective-pilot.json
          include-hidden-files: true
          # Runs are minute-frequent; restore only needs the newest successful lineage.
          retention-days: 3
      - name: Acknowledge Edge enrichment after durable artifact upload
        if: ${{ always() && steps.checkpoint_upload.outcome == 'success' && steps.edge_process.outcome == 'success' }}
        env:
          EDGE_SYNC_TOKEN: ${{ secrets.EDGE_SYNC_TOKEN }}
        run: python -m mozes.edge_enrichment ack
      - name: Acknowledge clinical candidate decisions after durable artifact upload
        if: ${{ always() && steps.checkpoint_upload.outcome == 'success' && steps.clinical_process.outcome == 'success' }}
        env:
          EDGE_SYNC_TOKEN: ${{ secrets.EDGE_SYNC_TOKEN }}
        run: python -m mozes.clinical_reconcile ack
      - name: Publish the small alert feed independently of Pages
        # The durable monitor artifact is already saved. A feed outage retries next run.
        continue-on-error: true
        env:
          MOZES_ALERT_FEED_TOKEN: ${{ secrets.MOZES_ALERT_FEED_TOKEN }}
        run: python -m mozes.alert_feed
      - name: Publish changed data or an unacknowledged freshness checkpoint
        if: steps.checkpoint_upload.outcome == 'success' && steps.data.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m mozes.publication_control dispatch
  prospective_cleanup:
    name: prospective-pilot-cleanup
    needs: [incident_eligibility, prospective_claim, monitor]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      vars.MOZES_PROSPECTIVE_AUTHORIZATION != '' &&
      inputs.source_run_id == '' && inputs.incident_recovery_authorization == '' &&
      (needs.incident_eligibility.result == 'skipped' ||
      (needs.incident_eligibility.result == 'success' && needs.incident_eligibility.outputs.mode == 'ordinary'))
    # A failed cleanup remains visible, without invalidating a durable monitor checkpoint.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Disable completed or expired one-shot authorization
        env:
          GH_TOKEN: ${{ github.token }}
          MOZES_PROSPECTIVE_CLEANUP_TOKEN: ${{ secrets.MOZES_PROSPECTIVE_CLEANUP_TOKEN }}
          MOZES_PROSPECTIVE_AUTHORIZATION: ${{ vars.MOZES_PROSPECTIVE_AUTHORIZATION }}
        # No installation, DB, source, publisher, notification or Git-write credential.
        run: python -m mozes.prospective_cleanup
