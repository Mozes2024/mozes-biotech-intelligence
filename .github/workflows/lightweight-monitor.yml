name: lightweight-live-monitor
on:
  schedule:
    - cron: '20 0,12,18 * * *'
    - cron: '20 6 * * 0,2,4,6'
    - cron: '20 6 * * 1,3,5'
  workflow_dispatch:
    inputs:
      deep_refresh:
        description: 'Run bounded full discovery in addition to the lightweight pass'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  actions: write
concurrency:
  group: mozes-live-data-producer
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
      MOZES_DB_PATH: .monitor/mozes-live.db
      MOZES_NEWS_ENABLED: '1'
      MOZES_HTTP_CACHE: .monitor/http-cache
      GH_TOKEN: ${{ github.token }}
      RUN_DEEP: ${{ inputs.deep_refresh == true || github.event.schedule == '20 6 * * 1,3,5' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - name: Restore the single monitor-state lineage
        run: python scripts/restore_monitor_state.py
      - name: Observe, reconcile and prepare data once
        id: data
        run: |
          if [ "$RUN_DEEP" = 'true' ]; then
            python -m mozes.pipeline_v2c monitor --deep
          else
            python -m mozes.pipeline_v2c monitor
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mozes-live-monitor
          path: |
            .monitor/mozes-live.db
            .monitor/manifest.json
            .monitor/http-cache
          include-hidden-files: true
          retention-days: 90
      - name: Publish only changed data or the daily heartbeat
        if: steps.data.outputs.should_publish == 'true'
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$current" = "$GITHUB_SHA" ]; then
            gh workflow run pages.yml --ref main -f source_run_id="$GITHUB_RUN_ID"
          else
            echo 'Newer code exists; its CI publication will restore this data.'
          fi
