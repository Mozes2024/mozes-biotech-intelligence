name: lightweight-live-monitor
on:
  # Reconciliation fallback; the Cloudflare Durable Object owns Stage-0 detection.
  schedule:
    - cron: '7,22,37,52 * * * *'
    - cron: '20 0,12,18 * * *'
    - cron: '20 6 * * 0,2,4,6'
  workflow_dispatch:
    inputs:
      priority_only:
        description: 'Check the priority issuers and their source feeds only'
        required: false
        default: true
        type: boolean
      source_run_id:
        description: 'Optional successful monitor run ID to restore (recovery only)'
        required: false
        type: string
      hot_ticker:
        description: 'Edge detected issuer ticker'
        required: false
        type: string
      hot_cik:
        description: 'Edge detected issuer CIK'
        required: false
        type: string
      hot_accession:
        description: 'Edge detected SEC accession'
        required: false
        type: string
      hot_source_url:
        description: 'Edge primary source URL'
        required: false
        type: string
permissions:
  contents: read
  actions: write
concurrency:
  # Hot lane must never share a lock with deep research refresh.
  group: mozes-hot-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
      MOZES_DB_PATH: .monitor/mozes-live.db
      MOZES_NEWS_ENABLED: '1'
      MOZES_HTTP_CACHE: .monitor/http-cache
      MOZES_SEC_HOT: '1'
      # FDA / wires / halts are polled by the hot step below, not again by the monitor step.
      MOZES_PRIMARY_FEEDS: '0'
      MOZES_ALERT_DISPATCH: '1'
      # No always-on server: this workflow (one serialized lineage) is the single push owner.
      MOZES_PUSH_FROM_ACTIONS: '1'
      MOZES_NTFY_URL: ${{ secrets.MOZES_NTFY_URL }}
      MOZES_WEBHOOK_URL: ${{ secrets.MOZES_WEBHOOK_URL }}
      MOZES_SMTP_USER: ${{ secrets.MOZES_SMTP_USER }}
      MOZES_SMTP_PASSWORD: ${{ secrets.MOZES_SMTP_PASSWORD }}
      MOZES_ALERT_EMAIL_TO: ${{ secrets.MOZES_ALERT_EMAIL_TO }}
      MOZES_ALERT_FEED_URL: ${{ vars.MOZES_ALERT_FEED_URL }}
      MOZES_ALERT_FEED_TOKEN: ${{ secrets.MOZES_ALERT_FEED_TOKEN }}
      # AI wording is opt-in; source-backed rule explanations work without it.
      MOZES_ALERT_AI: ${{ vars.MOZES_ALERT_AI }}
      MOZES_AI_MODEL: ${{ vars.MOZES_AI_MODEL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      MOZES_HOT_TICKER: ${{ inputs.hot_ticker }}
      MOZES_HOT_CIK: ${{ inputs.hot_cik }}
      MOZES_HOT_ACCESSION: ${{ inputs.hot_accession }}
      MOZES_HOT_SOURCE_URL: ${{ inputs.hot_source_url }}
      MOZES_EDGE_SYNC_URL: ${{ vars.MOZES_EDGE_SYNC_URL }}
      EDGE_SYNC_TOKEN: ${{ secrets.EDGE_SYNC_TOKEN }}
      RUN_PRIORITY: ${{ inputs.priority_only == true || github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - name: Restore the single monitor-state lineage
        run: python scripts/restore_monitor_state.py
      - name: Synchronize verified issuer universe to hot edge
        run: python -m mozes.edge_sync
      - name: Hot feeds (FDA, wires, Nasdaq halts, company IR) + push
        run: python -m mozes.hot_monitor --once --no-sec --allow-partial
      - name: Hot priority observe + alert outbox
        id: data
        run: |
          if [ "$RUN_PRIORITY" = 'true' ]; then
            python -m mozes.pipeline_v2c monitor --priority-only
          else
            python -m mozes.pipeline_v2c monitor
          fi
      - name: Explain already-queued alerts from their sources
        id: explanation
        # All current source checks and first pushes precede this bounded enrichment.
        continue-on-error: true
        timeout-minutes: 1
        run: python -m mozes.alert_explanation --limit 3
      - name: Export completed explanations without another source scan
        if: steps.explanation.outputs.changed == 'true'
        run: python -m mozes.pipeline_v2c export
      - uses: actions/upload-artifact@v4
        with:
          name: mozes-live-monitor
          # Keep the artifact small/reliable: the 240MB+ http-cache caused restore to
          # fall back to an old DB and drop live alerts (LPCN). Cache warms itself.
          path: |
            .monitor/mozes-live.db
            .monitor/manifest.json
          include-hidden-files: true
          # Runs are minute-frequent; restore only needs the newest successful lineage.
          retention-days: 3
      - name: Publish the small alert feed independently of Pages
        # The durable monitor artifact is already saved. A feed outage retries next run.
        continue-on-error: true
        run: python -m mozes.alert_feed
      - name: Publish only changed data or the daily heartbeat
        if: steps.data.outputs.should_publish == 'true' || steps.explanation.outputs.changed == 'true'
        run: |
          # Pages is a consumer: rebuild at most every 2 minutes so the site keeps pace with the clock.
          last=$(gh run list --workflow pages.yml --limit 1 --json createdAt --jq '.[0].createdAt // ""')
          if [ -n "$last" ] && [ $(( $(date +%s) - $(date -d "$last" +%s) )) -lt 120 ]; then
            echo "Pages rebuilt <2 min ago; this change ships with the next publish."
          else
            gh workflow run pages.yml --ref main -f source_run_id="$GITHUB_RUN_ID"
          fi
