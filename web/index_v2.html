<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOZES Biotech Catalyst Intelligence</title>
<style>
:root{--bg:#0b1220;--panel:#111827;--card:#fff;--ink:#111827;--mut:#64748b;--line:#e5e7eb;--ok:#047857;--warn:#b45309;--bad:#be123c;--blue:#1d4ed8}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#f3f6fa;color:var(--ink)}
header{background:linear-gradient(135deg,#0b1220,#172554);color:white;padding:22px 26px}h1{margin:0;font-size:24px}header p{margin:6px 0 0;color:#cbd5e1;font-size:13px}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:10px 18px;background:#111827;position:sticky;top:0;z-index:5}nav button{border:0;border-radius:8px;padding:8px 13px;background:transparent;color:#cbd5e1;cursor:pointer}nav button.on{background:white;color:#111827;font-weight:700}
main{max-width:1400px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 1px 2px #00000008}.big{font-size:28px;font-weight:800}.mut{color:var(--mut);font-size:12px}.note{padding:10px 12px;border-radius:10px;background:#fff7ed;border:1px solid #fed7aa;margin-bottom:12px;font-size:13px}
table{width:100%;border-collapse:collapse;background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13px}th,td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}th{background:#f8fafc;position:sticky;top:48px}tr:hover td{background:#fafafa}.pill{display:inline-block;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:700;white-space:nowrap}.ok{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.bad{background:#ffe4e6;color:#9f1239}.blue{background:#dbeafe;color:#1e40af}.gray{background:#e5e7eb;color:#374151}.ltr{direction:ltr;display:inline-block}.section-title{margin:18px 0 8px;font-size:17px}.reasons{margin:4px 0 0;padding-right:18px;font-size:12px;color:#475569}.src a{font-size:11px}.bar{height:7px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-top:4px}.bar span{display:block;height:100%;background:#334155}.danger{color:var(--bad);font-weight:700}.good{color:var(--ok);font-weight:700}@media(max-width:800px){table{font-size:11px}th,td{padding:6px}.hide-sm{display:none}}
</style>
</head><body>
<header><h1 id="title"></h1><p id="subtitle"></p></header><nav id="nav"></nav><main id="app"></main>
<script>
const H={
 title:"MOZES \u2014 \u05de\u05d5\u05d3\u05d9\u05e2\u05d9\u05df \u05e7\u05d8\u05dc\u05d9\u05d6\u05d8\u05d5\u05e8\u05d9\u05dd \u05d1\u05d1\u05d9\u05d5\u05d8\u05e7",
 subtitle:"\u05de\u05e2\u05e8\u05db\u05ea \u05de\u05d7\u05e7\u05e8 \u05e1\u05e4\u05e7\u05e0\u05d9\u05ea: CT.gov \u05de\u05d2\u05dc\u05d4 \u05de\u05d5\u05e2\u05de\u05d3\u05d9\u05dd; SEC/FDA/IR \u05de\u05d0\u05de\u05ea\u05d9\u05dd. HOLD/RUN-UP \u05e0\u05e2\u05d5\u05dc\u05d9\u05dd \u05e2\u05d3 \u05dc\u05d4\u05d5\u05db\u05d7\u05ea edge \u05de\u05d7\u05d5\u05e5 \u05dc\u05de\u05d3\u05d2\u05dd.",
 tabs:[["dash","\u05dc\u05d5\u05d7 \u05d1\u05e7\u05e8\u05d4"],["radar","\u05e7\u05d8\u05dc\u05d9\u05d6\u05d8\u05d5\u05e8\u05d9\u05dd"],["cand","\u05de\u05d5\u05e2\u05de\u05d3\u05d9 CT.gov"],["validation","\u05d5\u05dc\u05d9\u05d3\u05e6\u05d9\u05d4 / Backtest"]],
 cls:{REVIEW:"\u05dc\u05d1\u05d3\u05d9\u05e7\u05d4",WATCH:"\u05de\u05e2\u05e7\u05d1",AVOID_BINARY:"\u05dc\u05d4\u05d9\u05de\u05e0\u05e2 \u05de\u05d4\u05d1\u05d9\u05e0\u05d0\u05e8\u05d9",QUARANTINED:"\u05d4\u05e1\u05d2\u05e8 \u05de\u05e7\u05d5\u05e8\u05d9\u05ea",STALE_UNRESOLVED:"\u05d7\u05dc\u05d5\u05df \u05d7\u05dc\u05e3",HOLD_THROUGH_CANDIDATE:"HOLD \u05de\u05d0\u05d5\u05de\u05ea",RUNUP_CANDIDATE:"RUN-UP \u05de\u05d0\u05d5\u05de\u05ea"},
 state:{SCHEDULED:"\u05de\u05ea\u05d5\u05d6\u05de\u05df",VERIFIED:"\u05de\u05d0\u05d5\u05de\u05ea",DISCOVERED:"\u05e0\u05d2\u05dc\u05d4",QUARANTINED:"\u05d4\u05e1\u05d2\u05e8",APPROVED:"\u05d0\u05d5\u05e9\u05e8",CRL:"CRL"}
};
let D=null,tab="dash";const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const p=(x,c="gray")=>`<span class="pill ${c}">${esc(x)}</span>`;const cls=c=>p(H.cls[c]||c,c==="AVOID_BINARY"||c==="QUARANTINED"?"bad":c==="REVIEW"?"blue":"warn");
const stateP=s=>p(H.state[s]||s,s==="SCHEDULED"||s==="VERIFIED"?"ok":s==="QUARANTINED"?"bad":"gray");
function win(a){let w=a.date&&a.date.window;if(!w)return "\u2014";return `<span class="ltr">${esc(w.start)}${w.end!==w.start?" \u2192 "+esc(w.end):""}</span>`}
function bar(n){if(n==null)return "";return `<div class="bar"><span style="width:${Math.max(0,Math.min(100,n))}%"></span></div>`}
function renderNav(){nav.innerHTML=H.tabs.map(([k,v])=>`<button class="${tab===k?"on":""}" onclick="tab='${k}';render()">${v}</button>`).join("")}
function dashboard(){let live=D.live,ver=live.filter(x=>x.state.verification_state==="VERIFIED").length,q=live.filter(x=>x.state.verification_state==="QUARANTINED").length;return `<div class="note">\u05e0\u05db\u05d5\u05df \u05dc-${esc(D.today)}. \u05e6\u05d9\u05d5\u05df \u05d0\u05d9\u05e0\u05d5 \u05d4\u05d1\u05d8\u05d7\u05d4 \u05dc\u05db\u05d9\u05d5\u05d5\u05df \u05d4\u05de\u05e0\u05d9\u05d4; \u05d4\u05de\u05e2\u05e8\u05db\u05ea \u05de\u05e4\u05e8\u05d9\u05d3\u05d4 \u05d1\u05d9\u05df \u05d7\u05e9\u05d9\u05d1\u05d5\u05ea \u05d4\u05d0\u05d9\u05e8\u05d5\u05e2, \u05e8\u05d0\u05d9\u05d5\u05ea \u05d5\u05e1\u05d9\u05db\u05d5\u05df.</div><div class="grid">`+
`<div class="card"><div class="mut">\u05d0\u05d9\u05e8\u05d5\u05e2\u05d9\u05dd \u05e4\u05ea\u05d5\u05d7\u05d9\u05dd</div><div class="big">${live.length}</div></div>`+
`<div class="card"><div class="mut">\u05de\u05d0\u05d5\u05de\u05ea\u05d9\u05dd \u05de\u05de\u05e7\u05d5\u05e8 \u05e8\u05d0\u05e9\u05d5\u05e0\u05d9</div><div class="big good">${ver}</div></div>`+
`<div class="card"><div class="mut">\u05d1\u05d4\u05e1\u05d2\u05e8 \u05d0\u05d9\u05de\u05d5\u05ea</div><div class="big danger">${q}</div></div>`+
`<div class="card"><div class="mut">CT.gov candidates</div><div class="big">${D.candidates.length}</div></div>`+
`<div class="card"><div class="mut">RUN-UP gate</div><div class="big">${D.validation.runup.satisfied?"OPEN":"LOCKED"}</div><div class="mut">n=${D.validation.runup.n}/${D.validation.runup.min_n}</div></div>`+
`<div class="card"><div class="mut">HOLD gate</div><div class="big">${D.validation.hold_through.satisfied?"OPEN":"LOCKED"}</div><div class="mut">n=${D.validation.hold_through.n}/${D.validation.hold_through.min_n}</div></div></div>`+
`<h2 class="section-title">\u05d4\u05d0\u05d9\u05e8\u05d5\u05e2\u05d9\u05dd \u05d4\u05db\u05d9 \u05de\u05e9\u05de\u05e2\u05d5\u05ea\u05d9\u05d9\u05dd \u05db\u05e8\u05d2\u05e2</h2>${radarTable([...live].sort((a,b)=>b.impact.score-a.impact.score).slice(0,8))}`}
function radarTable(rows){return `<table><thead><tr><th>\u05d8\u05d9\u05e7\u05e8</th><th>\u05ea\u05d5\u05db\u05e0\u05d9\u05ea</th><th>\u05e1\u05d5\u05d2</th><th>\u05d7\u05dc\u05d5\u05df</th><th>\u05d0\u05d9\u05de\u05d5\u05ea</th><th>Impact</th><th>Evidence</th><th>\u05e1\u05d9\u05d5\u05d5\u05d2</th></tr></thead><tbody>${rows.map(a=>`<tr><td><b>${esc(a.ticker)}</b></td><td>${esc(a.program)}</td><td>${esc(a.type)}</td><td>${win(a)}</td><td>${stateP(a.state.status)}<div class="mut">${esc(a.state.verification_confidence)}%</div></td><td>${a.impact.score}${bar(a.impact.score)}</td><td>${a.evidence.score==null?"\u2014":a.evidence.score+bar(a.evidence.score)}<div class="mut">${esc(a.evidence.engine)}</div></td><td>${cls(a.classification.class)}<ul class="reasons">${(a.classification.reasons||[]).map(r=>`<li>${esc(r)}</li>`).join("")}</ul></td></tr>`).join("")}</tbody></table>`}
function radar(){return `<div class="note">\u05e8\u05e7 \u05de\u05e7\u05d5\u05e8 \u05e8\u05d0\u05e9\u05d5\u05e0\u05d9 \u05d9\u05db\u05d5\u05dc \u05dc\u05d4\u05e4\u05d5\u05da \u05ea\u05d0\u05e8\u05d9\u05da \u05dc\u05de\u05d0\u05d5\u05de\u05ea. \u05d0\u05d9\u05e8\u05d5\u05e2 \u05e9\u05d7\u05dc\u05e3 \u05d0\u05d5 \u05e0\u05e4\u05ea\u05e8 \u05de\u05d5\u05e7\u05d3\u05dd \u05d9\u05e6\u05d0 \u05de\u05d4\u05e8\u05e9\u05d9\u05de\u05d4.</div>${radarTable(D.live)}`}
function candidates(){return `<div class="note"><b>CT.gov \u2260 \u05ea\u05d0\u05e8\u05d9\u05da readout.</b> \u05d0\u05dc\u05d5 \u05e8\u05e7 \u05de\u05d5\u05e2\u05de\u05d3\u05d9\u05dd \u05e9\u05de\u05de\u05ea\u05d9\u05e0\u05d9\u05dd \u05dc\u05d0\u05d9\u05de\u05d5\u05ea SEC/FDA/IR.</div><table><thead><tr><th>NCT</th><th>\u05e1\u05e4\u05d5\u05e0\u05e1\u05e8</th><th>\u05d8\u05d9\u05e7\u05e8</th><th>\u05e9\u05dc\u05d1</th><th>\u05de\u05d7\u05e7\u05e8</th><th>Primary completion</th><th>\u05de\u05e6\u05d1</th></tr></thead><tbody>${D.candidates.map(c=>`<tr><td><span class="ltr">${esc(c.nct_id)}</span></td><td>${esc(c.sponsor)}</td><td><b>${esc(c.ticker||"\u2014")}</b><div class="mut">${c.ticker?Math.round((c.ticker_confidence||0)*100)+"%":""}</div></td><td>${esc(c.phase)}</td><td>${esc(c.title)}</td><td><span class="ltr">${esc(c.primary_completion)}</span></td><td>${c.promoted_event_id?p("\u05e7\u05d5\u05d3\u05dd \u05dc\u05d0\u05d9\u05e8\u05d5\u05e2","ok"):p("Discovery only","warn")}</td></tr>`).join("")}</tbody></table>`}
function validation(){let b=D.backtest,c=b.coverage;return `<div class="grid"><div class="card"><div class="mut">\u05d0\u05d9\u05e8\u05d5\u05e2\u05d9\u05dd \u05d4\u05d9\u05e1\u05d8\u05d5\u05e8\u05d9\u05d9\u05dd</div><div class="big">${c.historical_events}</div></div><div class="card"><div class="mut">\u05e2\u05dd \u05de\u05d7\u05d9\u05e8\u05d9\u05dd \u05dc\u05e4\u05e0\u05d9 \u05d0\u05d9\u05e8\u05d5\u05e2</div><div class="big">${c.with_pre_event_prices}</div></div><div class="card"><div class="mut">\u05e2\u05dd move \u05de\u05d5\u05ea\u05d0\u05dd session</div><div class="big">${c.with_session_aware_event_move}</div></div></div><h2 class="section-title">\u05e9\u05e2\u05e8\u05d9 \u05e9\u05d7\u05e8\u05d5\u05e8</h2><div class="grid"><div class="card"><b>RUN-UP</b><p>${D.validation.runup.satisfied?p("OPEN","ok"):p("LOCKED","bad")}</p><div class="mut">n=${D.validation.runup.n}/${D.validation.runup.min_n} \u00b7 ${esc(D.validation.runup.note||"")}</div></div><div class="card"><b>HOLD THROUGH</b><p>${D.validation.hold_through.satisfied?p("OPEN","ok"):p("LOCKED","bad")}</p><div class="mut">n=${D.validation.hold_through.n}/${D.validation.hold_through.min_n} \u00b7 ${esc(D.validation.hold_through.note||"")}</div></div></div><h2 class="section-title">\u05d0\u05d6\u05d4\u05e8\u05d5\u05ea \u05de\u05ea\u05d5\u05d3\u05d5\u05dc\u05d5\u05d2\u05d9\u05d5\u05ea</h2><div class="card"><ul>${b.warnings.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`}
function render(){renderNav();app.innerHTML=tab==="dash"?dashboard():tab==="radar"?radar():tab==="cand"?candidates():validation()}
document.getElementById("title").textContent=H.title;document.getElementById("subtitle").textContent=H.subtitle;
fetch("data_v2.json").then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(x=>{D=x;render()}).catch(e=>{app.innerHTML=`<div class="card">\u05dc\u05d0 \u05e0\u05de\u05e6\u05d0 data_v2.json. \u05d4\u05e8\u05e5: <code>mozes export-v2</code></div>`});
</script></body></html>
