name = "mozes-hot-clock"
main = "src/index.js"
compatibility_date = "2026-08-01"
keep_vars = true # Preserve dashboard-only identity/configuration on deploy.

[vars]
EDGE_INTERVAL_SECONDS = "120" # Preserve the emergency production setting on initial rollout.
EDGE_SEC_INTERVAL_SECONDS = "120"
EDGE_SEC_8K_INTERVAL_SECONDS = "120"
EDGE_SEC_6K_INTERVAL_SECONDS = "120"
EDGE_BUSINESSWIRE_INTERVAL_SECONDS = "180"
EDGE_GLOBENEWSWIRE_INTERVAL_SECONDS = "180"
EDGE_ISSUER_CACHE_SECONDS = "900"
EDGE_HEALTH_CACHE_SECONDS = "300"
EDGE_SEC_MAX_PAGES = "10"
EDGE_SEC_BACKFILL_ISSUERS = "3"
EDGE_ANALYSIS_BATCH_SIZE = "12"
# Local estimates reserve room for other account D1 consumers. Tune after validation.
EDGE_OTHER_DAILY_READ_ROWS = "1000000"
EDGE_OTHER_DAILY_WRITE_ROWS = "10000"
GITHUB_REPO = "Mozes2024/mozes-biotech-intelligence"
WORKFLOW_FILE = "lightweight-monitor.yml"
GITHUB_REF = "main"
EDGE_ENRICHMENT_ENABLED = "1"
SITE_ORIGIN = "https://mozes2024.github.io"

[[d1_databases]]
binding = "ALERTS_DB"
database_name = "mozes-alerts"
database_id = "9baf99f2-1ccc-4415-affd-2708a7210e7b"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "HOT_EDGE"
class_name = "HotEdge"

[[migrations]]
tag = "hot-edge-v3"
new_sqlite_classes = ["HotEdge"]

[triggers]
# */2 instead of * * * * *: Cloudflare sometimes silently drops a brand-new
# every-minute trigger; every-2-min is still well inside free-tier budget.
crons = ["*/2 * * * *"]

# Secrets (never in this file):
#   npx wrangler secret put GITHUB_TOKEN   # fine-grained token: this repo only, Actions = Read and write
#   npx wrangler secret put NTFY_URL       # optional, for the stale-monitor warning
#   npx wrangler secret put ALERT_FEED_TOKEN # shared only with the hot workflow
#   npx wrangler secret put EDGE_SYNC_TOKEN  # issuer sync endpoint only
