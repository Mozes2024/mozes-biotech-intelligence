[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mozes-biotech-catalyst"
version = "0.3.2"
description = "Verified, point-in-time biotech catalyst intelligence: discovery, provenance, scoring, validation and paper signals."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
mozes = "mozes.cli:main"

[tool.setuptools.packages.find]
include = ["mozes*"]

[tool.setuptools.package-data]
mozes = ["data/*.json", "data/starter_prices/*.csv", "data/starter_prices/*.json", "data/candidate_prices_2024_2026/*.csv", "data/candidate_prices_2024_2026/*.json", "schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
